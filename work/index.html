<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlliedWork – Mission Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/eclipse.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'dark': '#0a0a0a',
          'surface': '#141414',
        }
      }
    }
  }
</script>
<style>
  .CodeMirror {
    height: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
</style>
</head>
<body class="h-screen w-screen flex bg-[#0a0a0a] text-neutral-200 overflow-hidden font-sans">

<!-- SIDEBAR -->
<aside id="sidebar" class="w-14 hover:w-44 bg-[#141414] border-r border-white/5 flex flex-col h-full transition-all duration-200 ease-in-out overflow-hidden">
  <!-- Logo -->
  <div class="h-14 flex items-center px-4 border-b border-white/5 flex-shrink-0">
    <div class="w-6 h-6 rounded bg-gradient-to-br from-teal-500 to-teal-600 flex items-center justify-center text-xs font-bold text-black flex-shrink-0">AW</div>
    <span class="ml-3 font-semibold opacity-0 sidebar-label whitespace-nowrap">AlliedWork</span>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 py-4 overflow-y-auto">
    <div class="flex items-center px-4 py-3 text-neutral-500 hover:text-white hover:bg-white/5 cursor-pointer transition-all border-l-2 border-transparent hover:border-teal-500" onclick="location.reload()">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
      </svg>
      <span class="ml-3 opacity-0 sidebar-label whitespace-nowrap text-sm">Editor</span>
    </div>

    <div class="flex items-center px-4 py-3 text-neutral-500 hover:text-white hover:bg-white/5 cursor-pointer transition-all border-l-2 border-transparent hover:border-teal-500" onclick="window.open('robot-map.html','Map','width=1200,height=800')">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span class="ml-3 opacity-0 sidebar-label whitespace-nowrap text-sm">Map View</span>
    </div>

    <div class="flex items-center px-4 py-3 text-neutral-500 hover:text-white hover:bg-white/5 cursor-pointer transition-all border-l-2 border-transparent hover:border-teal-500" onclick="openThemeModal()">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"/>
      </svg>
      <span class="ml-3 opacity-0 sidebar-label whitespace-nowrap text-sm">Theme</span>
    </div>

    <div class="flex items-center px-4 py-3 text-neutral-500 hover:text-white hover:bg-white/5 cursor-pointer transition-all border-l-2 border-transparent hover:border-teal-500" onclick="openDocsModal()">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
      </svg>
      <span class="ml-3 opacity-0 sidebar-label whitespace-nowrap text-sm">Docs</span>
    </div>
  </nav>

  <!-- User Section -->
  <div class="border-t border-white/5 p-3 flex-shrink-0">
    <div class="flex items-center mb-3">
      <img id="user-pfp" class="w-8 h-8 rounded-full object-cover border border-white/10 flex-shrink-0" src="default_pfp.png" alt="User">
      <span id="user-name" class="ml-3 opacity-0 sidebar-label text-sm truncate whitespace-nowrap"></span>
    </div>
    
    <button id="logoutBtn" class="flex items-center w-full px-2 py-2 text-red-400 hover:text-red-300 hover:bg-red-500/5 rounded transition-all">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="ml-3 opacity-0 sidebar-label whitespace-nowrap text-sm">Logout</span>
    </button>
  </div>
</aside>

<!-- MAIN CONTENT -->
<main class="flex-1 flex flex-col min-w-0">
  <!-- Header -->
  <header class="h-14 flex items-center justify-between px-6 border-b border-white/5 flex-shrink-0">
    <div class="flex gap-2">
      <div id="tab-main" class="px-4 py-1.5 rounded-md text-sm text-white bg-white/5 border border-white/5 cursor-pointer transition-all" onclick="switchTab('main')">main.aw</div>
      <div id="tab-gen" class="px-4 py-1.5 rounded-md text-sm text-neutral-500 border border-transparent cursor-pointer hover:bg-white/5 transition-all" onclick="switchTab('gen')">generated.py</div>
    </div>
    
    <div class="bg-white/5 border border-white/5 px-3 py-1.5 rounded-lg text-xs text-neutral-400">
      Team <span class="font-semibold text-teal-400">Allied Algorithms #58590</span>
    </div>
  </header>

  <!-- Editor -->
  <div class="flex-1 relative min-h-0">
    <div id="editor-container" class="absolute inset-0"></div>
  </div>

  <!-- Bottom Panel -->
  <div class="h-[40%] flex border-t border-white/5 flex-shrink-0">
    <!-- Terminal -->
    <div class="w-[35%] bg-black p-4 flex flex-col font-mono text-xs">
      <div id="term-out" class="flex-1 overflow-y-auto space-y-1 text-neutral-500 mb-3"></div>
      <div class="flex items-center gap-2 pt-3 border-t border-white/5">
        <span class="text-teal-400">›</span>
        <input id="term-in" type="text" class="bg-transparent outline-none text-neutral-200 w-full placeholder-neutral-600" placeholder="Type a command...">
      </div>
    </div>

    <!-- Map -->
    <div class="flex-1 border-l border-white/5 bg-black p-2">
      <iframe id="map-frame" src="robot-map.html" class="w-full h-full rounded-lg border border-white/5"></iframe>
    </div>
  </div>
</main>

<!-- THEME MODAL -->
<div id="themeModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50" onclick="closeModal(event, 'themeModal')">
  <div class="bg-[#141414] border border-white/5 rounded-xl p-6 min-w-[300px]" onclick="event.stopPropagation()">
    <h2 class="text-lg font-semibold mb-6">Appearance</h2>
    <div class="flex items-center justify-between">
      <span class="text-sm text-neutral-400">Dark Mode</span>
      <div id="theme-toggle" class="w-12 h-6 bg-teal-500 rounded-full relative cursor-pointer" onclick="toggleTheme()">
        <div class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition-transform duration-200 translate-x-6"></div>
      </div>
    </div>
  </div>
</div>

<!-- DOCS MODAL -->
<div id="docsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50" onclick="closeModal(event, 'docsModal')">
  <div class="bg-[#141414] border border-white/5 rounded-xl p-6 min-w-[300px] text-center" onclick="event.stopPropagation()">
    <h2 class="text-lg font-semibold mb-6">Documentation</h2>
    <a href="https://yourdocslink.com" target="_blank" class="inline-block px-4 py-2.5 rounded-lg bg-teal-500 text-black font-medium hover:bg-teal-600 transition-colors">
      View Documentation →
    </a>
  </div>
</div>

<script>
// Supabase setup
const S_URL = "https://bqagmevmzpuvgiigyime.supabase.co";
const S_KEY = "sb_publishable_rcXEO06dge8l_iJI_AUbSA_vD321UNP";
const supabaseClient = supabase.createClient(S_URL, S_KEY);

// Globals
const bc = new BroadcastChannel('allied_sync');
let editor, motorL = "C", motorR = "D", currentFile = "main", autoCode = false, saveTimer;
const files = { main: "speed(5)\ndrive(100)", gen: "" };

// Sidebar label animation
const sidebar = document.getElementById('sidebar');
sidebar.addEventListener('mouseenter', () => {
  document.querySelectorAll('.sidebar-label').forEach(el => {
    el.classList.remove('opacity-0');
    el.classList.add('opacity-100');
  });
});
sidebar.addEventListener('mouseleave', () => {
  document.querySelectorAll('.sidebar-label').forEach(el => {
    el.classList.remove('opacity-100');
    el.classList.add('opacity-0');
  });
});

// Terminal logging
function log(text, className = "text-neutral-500") {
  const div = document.createElement('div');
  div.className = className;
  div.textContent = `› ${text}`;
  const output = document.getElementById('term-out');
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

// CodeMirror setup
editor = CodeMirror(document.getElementById('editor-container'), {
  value: files.main,
  mode: "python",
  theme: "dracula",
  lineNumbers: true,
  tabSize: 2,
  indentUnit: 2,
  smartIndent: true,
  lineWrapping: false
});

const editorContainer = document.getElementById('editor-container');
const editorResizeObserver = new ResizeObserver(() => editor.refresh());
editorResizeObserver.observe(editorContainer);

editor.on('change', () => {
  if (currentFile === 'main') {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 2000);
  }
});

// Save to Supabase
async function save() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  await supabaseClient.from('user_scripts').upsert({
    id: user.id,
    aw_content: editor.getValue(),
    updated_at: new Date()
  });
}

// Terminal input handler
document.getElementById('term-in').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = e.target.value.trim();
    e.target.value = "";
    
    if (val.toLowerCase() === 'record') {
      autoCode = !autoCode;
      log(`Recording: ${autoCode ? 'ON' : 'OFF'}`, autoCode ? 'text-teal-400' : 'text-red-400');
      return;
    }

    if (val.toLowerCase() === 'help') {
      log("Commands: record | clear | reset | L,R (motors) | x,y (inches)", "text-teal-400");
      return;
    }

    if (val.toLowerCase() === 'clear') {
      document.getElementById('term-out').innerHTML = "";
      return;
    }

    if (val.toLowerCase() === 'reset') {
      bc.postMessage({ type: 'RESET_POS' });
      log("Resetting robot position.", "text-teal-400");
      return;
    }
    
    if (val.includes(',')) {
      if (/[A-F],[A-F]/.test(val.toUpperCase())) {
        const parts = val.toUpperCase().split(',');
        motorL = parts[0];
        motorR = parts[1];
        log(`Motors set: ${motorL}, ${motorR}`, "text-teal-400");
      } else {
        const coords = val.split(',');
        const x = parseFloat(coords[0]);
        const y = parseFloat(coords[1]);
        if (Number.isFinite(x) && Number.isFinite(y)) {
          bc.postMessage({
            type: 'SET_POS',
            x,
            y
          });
        } else {
          log("Invalid coordinates. Use x,y in inches.", "text-red-400");
        }
      }
    }
  }
});

// BroadcastChannel messaging
bc.onmessage = (e) => {
  if (e.data.type === 'RECORD_MOVE' && autoCode) {
    const turn = `turn(${Math.round(e.data.angle)})`;
    const drive = `drive(${Math.round(e.data.dist)})`;
    editor.setValue(`${editor.getValue()}\n${turn}\n${drive}`);
  }
  if (e.data.type === 'REQUEST_RUN') {
    bc.postMessage({ type: 'RUN_CODE', command: editor.getValue() });
  }
};

// Tab switching
function switchTab(tab) {
  if (tab === currentFile) return;
  
  if (currentFile === 'main') files.main = editor.getValue();
  
  if (tab === 'gen') {
    const body = files.main.split('\n')
      .map(line => (line.trim() && !line.trim().startsWith('#')) ? `    await ${line}` : `    ${line}`)
      .join('\n');
      
    files.gen = `import runloop, math, motor_pair, motor, time
from hub import port
r = 22
total = 100

def speed(x):
    global velocity
    velocity = x * 110

async def drive(desired):
    circumference = 2 * r * math.pi
    rotations = desired / circumference
    degrees = int(rotations * 360)
    await motor_pair.move_for_degrees(motor_pair.PAIR_1, degrees, 0, velocity=velocity)

async def turn(desired):
    distance = int((desired / total) * 360)
    await motor_pair.move_for_degrees(motor_pair.PAIR_1, distance, 100)

def speed_motor(x):
    global velocity_motor
    velocity_motor = x * 110

async def turn_motor(port, desired):
    angle = desired / 2
    motor.run_for_degrees(port.port, angle, velocity_motor)

def wait(mili):
    time.sleep_ms(mili)

async def main():
    motor_pair.pair(motor_pair.PAIR_1, port.${motorL}, port.${motorR})
${body}

runloop.run(main())`;
    
    editor.setValue(files.gen);
    editor.setOption('readOnly', true);
  } else {
    editor.setValue(files.main);
    editor.setOption('readOnly', false);
  }
  
  currentFile = tab;
  
  // Update tab styles
  const mainTab = document.getElementById('tab-main');
  const genTab = document.getElementById('tab-gen');
  
  if (tab === 'main') {
    mainTab.className = 'px-4 py-1.5 rounded-md text-sm text-white bg-white/5 border border-white/5 cursor-pointer transition-all';
    genTab.className = 'px-4 py-1.5 rounded-md text-sm text-neutral-500 border border-transparent cursor-pointer hover:bg-white/5 transition-all';
  } else {
    mainTab.className = 'px-4 py-1.5 rounded-md text-sm text-neutral-500 border border-transparent cursor-pointer hover:bg-white/5 transition-all';
    genTab.className = 'px-4 py-1.5 rounded-md text-sm text-white bg-white/5 border border-white/5 cursor-pointer transition-all';
  }
}

// Initialize
async function init() {

  const { data } = await supabaseClient.from('user_scripts')
    .select('aw_content')
    .eq('id', user.id)
    .single();
    
  if (data) {
    files.main = data.aw_content;
    editor.setValue(data.aw_content);
  }

  const pfp = user.user_metadata?.avatar_url || 
    `https://api.dicebear.com/6.x/thumbs/svg?seed=${user.email}`;
  document.getElementById("user-pfp").src = pfp;
  document.getElementById("user-name").textContent = user.email.split("@")[0];

  log(`Welcome, ${user.email.split('@')[0]}`, "text-teal-400");
  log("Type 'record' to start path recording", "text-neutral-500");
}

document.getElementById('logoutBtn').onclick = async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
};

init();

// Modal functions
function openThemeModal() {
  document.getElementById("themeModal").classList.remove("hidden");
  document.getElementById("themeModal").classList.add("flex");
}

function openDocsModal() {
  document.getElementById("docsModal").classList.remove("hidden");
  document.getElementById("docsModal").classList.add("flex");
}

function closeModal(event, modalId) {
  if (event.target.id === modalId) {
    event.target.classList.add("hidden");
    event.target.classList.remove("flex");
  }
}

// Theme toggle
function toggleTheme() {
  const toggle = document.getElementById("theme-toggle");
  const ball = toggle.querySelector('div');
  
  if (ball.classList.contains('translate-x-6')) {
    ball.classList.remove('translate-x-6');
    ball.classList.add('translate-x-0');
    toggle.classList.remove('bg-teal-500');
    toggle.classList.add('bg-neutral-600');
    editor.setOption('theme', 'eclipse');
  } else {
    ball.classList.remove('translate-x-0');
    ball.classList.add('translate-x-6');
    toggle.classList.remove('bg-neutral-600');
    toggle.classList.add('bg-teal-500');
    editor.setOption('theme', 'dracula');
  }
}
</script>
</body>
</html>
